version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: langapp-db
    environment:
      POSTGRES_USER: langapp
      POSTGRES_PASSWORD: langapp_dev
      POSTGRES_DB: langapp
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langapp -d langapp"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: langapp-api
    environment:
      - DATABASE_URL=postgresql+asyncpg://langapp:langapp_dev@db:5432/langapp
      - API_V1_STR=/api/v1
      - PROJECT_NAME=LinguaBridge API
      - SECRET_KEY=dev-secret-change-in-production
      - ACCESS_TOKEN_EXPIRE_MINUTES=10080
      - BACKEND_CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
    ports:
      - "8004:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data: